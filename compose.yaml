name: gitscope

services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: gitscope
      POSTGRES_USER: gitscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitscope-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitscope -d gitscope"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [app]

  backend:
    build:
      context: ./backend
    environment:
      ADDR: :10000
      DATABASE_URL: postgres://gitscope:${POSTGRES_PASSWORD:-gitscope-local-password}@database:5432/gitscope?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-1234567890}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:10000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: ""
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [app]

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
