apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
  namespace: gitscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-service
  template:
    metadata:
      labels:
        app: db-service
    spec:
      containers:
        - name: db-service
          image: gitscope/db-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neon-db-secret
                  key: DATABASE_URL
          readinessProbe:
            tcpSocket: { port: 50052 }
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: { port: 50052 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
